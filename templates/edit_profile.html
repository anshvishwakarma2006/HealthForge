{% extends "base.html" %}


{% block title %}

Edit Profile - HealthForge AI

{% endblock %}


{% block content %}


<a
    href="{{ url_for('profile') }}"
    class="back-link"
>
    ← Back to Profile
</a>


<div class="edit-profile-page">


    <div class="page-header">

        <h1>
            Edit Profile
        </h1>

        <p>
            Update your personal information.
        </p>

    </div>


    <div class="edit-profile-card">


        {% if error %}

        <div class="profile-error">

            {{ error }}

        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('edit_profile') }}"
        >


            <!-- Name -->

            <div class="profile-form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ patient.name }}"
                    required
                >

            </div>



            <!-- Email -->

            <div class="profile-form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    value="{{ patient.email }}"
                    disabled
                >

                <small>
                    Email cannot be changed here.
                </small>

            </div>



            <!-- Phone -->

            <div class="profile-form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    value="{{ patient.phone }}"
                    required
                >

            </div>



            <!-- DOB -->

            <div class="profile-form-group">

                <label for="date_of_birth">
                    Date of Birth
                </label>

                <input
                    type="date"
                    id="date_of_birth"
                    name="date_of_birth"

                    {% if patient.date_of_birth %}

                    value="{{ patient.date_of_birth.strftime('%Y-%m-%d') }}"

                    {% endif %}

                >

            </div>



            <!-- Address -->

            <div class="profile-form-group">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    name="address"
                    rows="4"
                    placeholder="Enter your address"
                >{{ patient.address or "" }}</textarea>

            </div>



            <!-- Buttons -->

            <div class="profile-form-actions">

                <a
                    href="{{ url_for('profile') }}"
                    class="secondary-button"
                >
                    Cancel
                </a>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Save Changes
                </button>

            </div>


        </form>


    </div>


</div>


{% endblock %}
