<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HealthForge AI - Register</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <div class="register-container">

        <h1>Create Account</h1>

        <p>Join HealthForge AI</p>


        <form method="POST">

    <label>Name</label>
    <input
        type="text"
        name="name"
        placeholder="Enter your name"
        required
    >

    <label>Email</label>
    <input
        type="email"
        name="email"
        placeholder="Enter your email"
        required
    >

    <label>Password</label>
    <input
        type="password"
        name="password"
        placeholder="Create a password"
        required
    >

    <label>Phone</label>
    <input
        type="text"
        name="phone"
        placeholder="Enter your phone"
    >

    <label>Date of Birth</label>
    <input
        type="date"
        name="date_of_birth"
        required
    >
    <label>Address</label>

    <input
    type="text"
    name="address"
    placeholder="Enter your address"
    required
    >

    

    <button type="submit">
        Register
    </button>

</form>


        <p>
            Already have an account?

            <a href="/">
                Login
            </a>
        </p>

    </div>

</body>

</html>
