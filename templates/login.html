<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HealthForge AI - Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body class="login-page">

    <div class="login-card">

        <div class="login-header">

            <h1>Welcome Back!</h1>

            <p>
                Login to your HealthForge AI account.
            </p>

        </div>


        <form method="POST" action="{{ url_for('role_login', role='patient') }}">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-submit"
            >
                Login
            </button>

        </form>


        <div class="register-link">

            <p>
                Don't have an account?

                <a href="{{ url_for('register') }}">
                    Register
                </a>
            </p>

        <div class="register-link"><p><a href="{{ url_for('index') }}">← Choose another role</a></p></div>

    </div>

</body>

</html>
