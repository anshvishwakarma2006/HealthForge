<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Receptionist | HealthForge AI{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/receptionist.css') }}">
</head>
<body>
<div class="rec-shell">
<aside class="rec-sidebar">
  <div class="rec-brand">♥ HealthForge <span>AI</span></div>
  <nav>
    <a href="{{ url_for('receptionist_dashboard') }}">Dashboard</a>
    <a href="{{ url_for('receptionist_patients') }}">Patients</a>
    <a href="{{ url_for('receptionist_appointments_page') }}">Appointments</a>
    <a href="{{ url_for('logout') }}">Logout</a>
  </nav>
</aside>
<main class="rec-main">
  {% with messages=get_flashed_messages(with_categories=true) %}
  {% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</div>
</body></html>
